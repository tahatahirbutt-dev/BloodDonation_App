name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # google-services.json is intentionally not committed. Store its base64
      # contents in the GOOGLE_SERVICES_JSON_BASE64 Actions secret to enable APK builds.
      - name: Restore google-services.json
        id: gsj
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 -d > android/app/google-services.json
          fi
          if [ -f android/app/google-services.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        if: steps.gsj.outputs.present == 'true' && github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Archive APK
        if: steps.gsj.outputs.present == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        working-directory: rules_test
        run: npm ci

      - name: Run rules tests on the emulator
        working-directory: rules_test
        run: npx -y firebase-tools emulators:exec --only firestore --project demo-bloodrules "node --test firestore_rules_test.mjs"
